<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/wordSet-main.css">
    <link rel="manifest" href="./manifest.json">
    <script src="https://kit.fontawesome.com/514b3bc82c.js" crossorigin="anonymous"></script>
    <title>main</title>
</head>
<body>
    
    <div id="header">
        <div id="header-inner">
            <div id="word-set-name"></div>
            <div id="word-set-info">
                <div id="word-set-info-inner">
                    <div id="word-set-words-count"></div>
                    <div id="word-set-study-date"></div>
                    <div id="word-set-edit-date"></div>
                </div>
                <div id="ws-info-btns-wrap">
                    <div id="word-set-del-btn">세트 삭제</div>
                    <div id="word-set-edit-btn">편집</div>
                </div>
            </div>
            <div id="setup-tools">
                <div id="setup-tools-verticalbar"><i class="fa-solid fa-ellipsis-vertical"></i></div>
                <div id="setup-tools-left">
                    <div id="sect-sepr">
                        <span id="sect-sepr-header">
                            <span>
                                12 개씩 구간 분리
                            </span>
                            <i class="fa-solid fa-caret-down"></i>
                        </span>
                        <div id="sect-sepr-group">
                            <div id="sect-sepr-whole">전체 보기</div>
                            <div id="sect-sepr-setup">
                                <input id="sect-sepr-input" type="text" placeholder="개수">
                                개씩 보기
                            </div>
                        </div>
                    </div>
                    <div id="view-dontknow-word">
                        모르는 단어만 보기
                        <div id="vdkw-toggle-switch"></div>
                    </div>
                </div>
                <div id="setup-tools-right">
                    <div id="go-set-list-btn">목록으로 돌아가기</div>
                </div>
            </div>
        </div>
    </div>
    <div id="contents">
        <div id="contents-inner">
            <div id="contents-header">
                <div id="search-word-area">
                    <input id="search-word-input" type="text" placeholder="검색어 입력">
                    <div id="search-del-btn"><i class="fa-regular fa-circle-xmark"></i></div>
                </div>
                <div id="gotonum-area">
                    <input id="gotonum-input" type="text" inputmode="numeric" enterkeyhint="go" pattern="[0-9]*" placeholder="번호로 이동">
                    <div id="gotonum-arrow"><i class="fa-solid fa-arrow-down"></i></div>
                </div>
                <div id="study-test-btn">학습 / 테스트</div>
            </div>
            <div id="words-sect-scroll-area">


                <!-- 
                
                <div class="words-sect">
                    <div class="words-sect-header">
                        <div class="words-sect-header-inner">
                            <div class="words-sect-header-left">
                                <div class="sect-num">1구간</div>
                                <div class="words-range">
                                    0001-0020
                                </div>
                            </div>
                            <div class="words-sect-header-right">
                                <div class="memorize-btn">암기하기</div>
                            </div>
                        </div>
                    </div>
                    <div class="sect-words-group">

                        <div class="word-unit">
                            <div class="whet-know"></div>
                            <div class="word-spell">spell</div>
                            <div class="word-phon">[<span>word.phon</span>]</div>
                            <div class="word-mean">word.mean</div>
                        </div>

                    </div>
                </div>

                 -->
                

            </div>
        </div>
    </div>
    
    <div id="stpop-wrapper">
        <div id="study-test-popup">
            <div id="stpop-top">
                <span id="stpop-title"></span>
                <div id="stpop-close-btn"><i class="fa-solid fa-xmark"></i></div>
            </div>
            <div id="st-select-btns" class="show">
                <div id="study-btn">구간별 학습</div>
                <div id="test-btn">구간별 테스트</div>
            </div>
            <div id="stpop-sect-inner">


                <!-- <div class="stpop-sect"></div> -->
                <!-- <div class="stpop-sect"></div> -->
                <!-- <div class="stpop-sect"></div> -->


            </div>
            <div id="stpop-bottom">
                <div id="stpop-btns">
                    <div id="stpop-knowexc">
                        아는 단어 제외
                        <div id="knowexc-switch"></div>
                    </div>
                    <div id="stpop-shuffle">
                        셔플 모드
                        <div id="shuffle-switch"></div>
                    </div>
                </div>
                <div id="stpop-start-wrap">
                    <div id="study-start-btn">학습 시작<i class="fa-solid fa-angle-right"></i></div>
                    <div id="test-start-btn">테스트 시작<i class="fa-solid fa-angle-right"></i></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/wordSet-main.js"></script>
</body>
</html>
