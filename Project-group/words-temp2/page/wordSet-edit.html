<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" href="../manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="../basis/common.css">
    <link rel="stylesheet" href="../css/wordSet-edit.css">
    <script src="https://kit.fontawesome.com/514b3bc82c.js" crossorigin="anonymous"></script>
    <title>edit</title>
</head>
<body>
    
    <div id="header">
        <div id="header-inner">
            <div id="word-set-name"><input id="word-set-name-input" type="text" placeholder="세트 제목을 입력하세요"></div>
            <div id="word-set-info">
                <div id="word-set-info-inner">
                    <div id="word-set-words-count"></div>
                    <div id="word-set-study-date"></div>
                    <div id="word-set-edit-date"></div>
                </div>
                <div id="ws-info-btns-wrap">
                    <div id="word-set-del-btn">세트 삭제</div>
                </div>
            </div>
            <div id="edit-tools">
                <div id="edit-tools-inner">
                    <div id="window-sep">
                        편집창 분할
                        <div id="window-sep-toggle-switch"></div>
                    </div>
                    <div id="view-match">
                        <span>
                            뷰(view) 일치
                            <i class="fa-solid fa-caret-down"></i>
                        </span>
                        <div id="view-match-btn-group" class="">
                            <div id="view-match-btn-left">좌측에 맞추기</div>
                            <div id="view-match-btn-right">우측에 맞추기</div>
                        </div>
                    </div>
                    <div id="sect-sepr">
                        <span id="sect-sepr-header">
                            <span>
                                <!-- 10개씩 구간 분리 -->
                            </span>
                            <i class="fa-solid fa-caret-down"></i>
                        </span>
                        <div id="sect-sepr-group" class="">
                            <div id="sect-sepr-whole">전체 보기</div>
                            <div id="sect-sepr-setup">
                                <input id="sect-sepr-input" type="text" placeholder="개수">
                                개씩 보기
                            </div>
                        </div>
                    </div>
                </div>
                <div id="edit-save-btn">저장</div>
            </div>
        </div>
    </div>
    <div id="contents">
        <div id="contents-inner">
            <div id="wse-left-window" class="word-set-edit-window">
                <div id="left-window-header" class="wse-window-header">
                    <div id="left-search-word-area" class="search-word-area">
                        <div id="left-search-scope" class="search-scope"></div>
                        <input id="left-search-word-input" class="search-word-input" type="text" placeholder="검색어 입력">
                        <div id="left-search-del-btn" class="search-del-btn"><i class="fa-regular fa-circle-xmark"></i></div>
                    </div>
                    <div id="left-gotonum-area" class="wse-gotonum-area">
                        <input id="left-gotonum-input" class="wse-gotonum-input" type="text" inputmode="numeric" enterkeyhint="go" pattern="[0-9]*" placeholder="번호로 이동">
                        <div id="left-gotonum-arrow" class="wse-gotonum-arrow"><i class="fa-solid fa-arrow-down"></i></div>
                    </div>
                    <div id="left-word-drag-move" class="word-drag-move">
                        단어 이동
                    </div>
                    <div id="left-select-delete" class="select-delete">
                        선택삭제
                    </div>
                </div>
                <div id="left-words-wrapper" class="wse-words-wrapper">
                    <div id="left-words-wrapper-inner" class="wse-words-wrapper-inner">

                        <div class="create-word-unit">단어 생성하기</div>

                        <!-- <div class="word-unit-wrapper">
                            <div class="word-unit">
                                <div class="word-number">0001</div>
                                <div class="word-spell">
                                    <input class="word-spell-input" type="text">
                                </div>
                                <div class="word-phon">
                                    <input class="word-phon-input" type="text" inputmode="none">
                                </div>
                                <div class="word-mean">
                                    <input class="word-mean-input" type="text">
                                </div>
                            </div>
                            <div class="word-add-btn"><i class="fa-solid fa-plus"></i></div>
                        </div> -->
                        <!-- <div class="section-bar-unit"></div> -->
                        
                    </div>
                </div>
            </div>
            <div id="wse-right-window" class="word-set-edit-window">
                <div id="right-window-header" class="wse-window-header">
                    <div id="right-search-word-area" class="search-word-area">
                        <div id="right-search-scope" class="search-scope"></div>
                        <input id="right-search-word-input" class="search-word-input" type="text" placeholder="검색어 입력">
                        <div id="right-search-del-btn" class="search-del-btn"><i class="fa-regular fa-circle-xmark"></i></div>
                    </div>
                    <div class="wse-gotonum-area">
                        <input id="right-gotonum-input" class="wse-gotonum-input" type="text" inputmode="numeric" enterkeyhint="go" pattern="[0-9]*" placeholder="번호로 이동">
                        <div id="right-gotonum-arrow" class="wse-gotonum-arrow"><i class="fa-solid fa-arrow-down"></i></div>
                    </div>
                    <div id="right-word-drag-move" class="word-drag-move">
                        단어 이동
                    </div>
                    <div id="right-select-delete" class="select-delete">
                        선택삭제
                    </div>
                </div>
                <div id="right-words-wrapper" class="wse-words-wrapper">
                    <div id="right-words-wrapper-inner" class="wse-words-wrapper-inner">

                        <!-- <div class="word-unit-wrapper">
                            <div class="word-unit">
                                <div class="word-number">0001</div>
                                <div class="word-spell">
                                    <input class="word-spell-input" type="text">
                                </div>
                                <div class="word-phon">
                                    <input class="word-phon-input" type="text" inputmode="none">
                                </div>
                                <div class="word-mean">
                                    <input class="word-mean-input" type="text">
                                </div>
                            </div>
                            <div class="word-add-btn"><i class="fa-solid fa-plus"></i></div>
                        </div> -->
                        
                    </div>
                </div>
            </div>

            <div id="delete-undo-alert">
                <div id="delete-undo-btn">
                    실행취소
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <div id="delete-undo-alert-off"><i class="fa-solid fa-x"></i></div>
            </div>
        </div>
    </div>
    
    <div id="ipa-keyboard">
        <div id="ipa-keyboard-inner">

        </div>
    </div>

    <script type="module" src="../js/wordSet-edit.js"></script>
</body>
</html>
